name = "polymarket-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["* * * * *"]

# Legacy user profiles + subscriber list. Read-only fallback after R2 migration;
# current code does not write to Workers KV.
[[kv_namespaces]]
binding = "BOT_KV"
id = "ac65f259d26749cfa735493ffa8a82e7"

# Snapshot, lastProcessed, user profiles, and subscriber index.
[[r2_buckets]]
binding = "BOT_STATE"
bucket_name = "polymarket-bot-state"

# Set secrets after deploy:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put CHANNEL_ID   ← numeric ID of @shtanga0x, e.g. -1001234567890

name = "polymarket-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["* * * * *"]

# Legacy user profiles + subscriber list. Read-only fallback after R2 migration;
# current code does not write to Workers KV.
[[kv_namespaces]]
binding = "BOT_KV"
id = "ac65f259d26749cfa735493ffa8a82e7"

# Snapshot, lastProcessed, user profiles, and subscriber index.
[[r2_buckets]]
binding = "BOT_STATE"
bucket_name = "polymarket-bot-state"

# Shared cross-project user/event database (see hyper_bot/schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "shtanga-users"
database_id = "961c61d8-6076-44cc-a613-3929e5110832"

# Set secrets after deploy:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put CHANNEL_ID   ← numeric ID of the closed group, e.g. -1003468238602

# ─── Workers Paid hardening (2026-07-03) ──────────────────────────────────────
# Logs go to Workers Logs; any exception/CPU-blowout pages the owner via the
# shtanga-tail-alerts Tail Worker.
[observability]
enabled = true

[[tail_consumers]]
service = "shtanga-tail-alerts"
